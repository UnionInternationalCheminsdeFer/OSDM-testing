                } else if(bru.getEnvVar("scenarioAction")?.includes("DELETE")) {
                    bru.runner.setNextRequest("16. DEL Exchange Offer");
                    console.log("scenarioAction in data file contains 'DELETE' keyword, executing 16. DEL Exchange Offer")    
                } else{
                    console.log("scenarioAction in data file doesn't contain 'PATCH' or 'DELETE' keyword, ending test scenario ...")    
                    bru.runner.setNextRequest("14. POST Obtaining Fulfillments from Booking");

                //     //pm.execution.setNextRequest(null);
                }
