                if (currentIndex < totalPassengers) {
                    bru.runner.setNextRequest(req.getName());
                } else {
                    bru.runner.setNextRequest("07. GET Booking before Fulfillments");
                }
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
