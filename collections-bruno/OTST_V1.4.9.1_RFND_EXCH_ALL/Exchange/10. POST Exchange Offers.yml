info:
  name: 10. POST Exchange Offers
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_base}}/bookings/{{bookingId}}/exchange-offers?embed=ALL"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
    - name: Content-Type2
      value: application/json;version={{osdm-version}}
      disabled: true
  params:
    - name: embed
      value: ALL
      type: query
  body:
    type: json
    data: "{{requestExchangeOffersBodyData}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { requestExchangeOffersBody } = require(bru.getEnvVar("library_base")+"requestsBuilder.js");

        console.log("⏩ [STEP] Executing request : " + req.getName());

        requestExchangeOffersBody(bru.getEnvVar("overruleCode"));
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchExchangeOffersResponse } = require(bru.getEnvVar("library_base")+"exchanges.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
            bru.runner.stopExecution();
            throw new Error(`Exiting script due to wrong response status: ${res.getStatus()}`);
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            bru.runner.stopExecution();
            return;
        }

        postPatchExchangeOffersResponse(jsonData, expectedFulfillmentStatus=["CONFIRMED", "FULFILLED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
