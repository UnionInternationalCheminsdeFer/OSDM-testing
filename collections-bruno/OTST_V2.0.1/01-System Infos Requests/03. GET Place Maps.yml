info:
  name: 03. GET Place Maps
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_base}}/availabilities/place-map?contextId={{offerId}}&contextType=OFFER&resourceId={{reservationId}}&resourceType=RESERVATION"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  params:
    - name: contextId
      value: "{{offerId}}"
      type: query
    - name: contextType
      value: OFFER
      type: query
    - name: resourceId
      value: "{{reservationId}}"
      type: query
    - name: resourceType
      value: RESERVATION
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        var coach = jsonData.vehicleAvailability.vehicle.coaches[0];
        var preSelection = coach.compartments[0];
        bru.setEnvVar("preselectedCoach", coach.coachNumber);
        bru.setEnvVar("preselectedPlace", preSelection.place);
        bru.setEnvVar("layoutId", coach.layoutId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
