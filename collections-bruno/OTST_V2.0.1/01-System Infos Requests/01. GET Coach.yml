info:
  name: 01. GET Coach
  type: http
  seq: 1

http:
  method: GET
  url: "{{api_base}}/{{coachLayoutsResource}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const DEFAULT_LATEST_VERSION = '3.9.0';

        function parseVersion(v) {
          if (v == null) return null;
          const m = String(v).trim().match(/(\d+)\.(\d+)(?:\.(\d+))?/);
          if (!m) return null;
          return { major: Number(m[1]), minor: Number(m[2]), patch: Number(m[3] || 0) };
        }

        function score(v) {
          return (v.major * 1000000) + (v.minor * 1000) + v.patch;
        }

        function pickLatestFromList(raw) {
          if (!raw) return null;
          return String(raw)
            .split(',')
            .map(s => parseVersion(s))
            .filter(Boolean)
            .sort((a, b) => score(b) - score(a))[0] || null;
        }

        const apiVersion = parseVersion(bru.getEnvVar('apiVersion'));
        const apiVersionFromVersions = pickLatestFromList(bru.getEnvVar('apiVersionsAvailable'));
        const scenarioVersion = parseVersion(bru.getEnvVar('osdmVersion'));
        const effective = apiVersion || apiVersionFromVersions || scenarioVersion || parseVersion(DEFAULT_LATEST_VERSION);

        const isCoachDeck = score(effective) >= score({ major: 3, minor: 8, patch: 0 });
        bru.setVar('coachLayoutsResource', isCoachDeck ? 'coach-deck-layouts' : 'coach-layouts');

    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base") + "displays.js");
        const { bruTest } = require(bru.getEnvVar("library_base") + "testCapture.js");

        const resource = bru.getVar('coachLayoutsResource') || 'coach-layouts';
        const endpoint = `/${resource}`;
        const statusCode = res.getStatus();

        // Reset coach list markers for this request execution
        bru.setEnvVar('coachListHasValidData', 'false');
        bru.setEnvVar('coachListCandidateIds', '[]');

        function pickCoachIds(body) {
          const ids = [];
          const add = (v) => {
            const s = v == null ? '' : String(v).trim();
            if (!s || /^null$/i.test(s) || ids.includes(s)) return;
            ids.push(s);
          };

          const fromArr = (arr) => {
            if (!Array.isArray(arr)) return;
            arr.forEach(item => {
              if (!item || typeof item !== 'object') return;
              add(item.layoutId);
              add(item.id);
            });
          };

          const fromObj = (obj) => {
            if (!obj || typeof obj !== 'object') return;
            add(obj.layoutId);
            add(obj.id);
          };

          if (Array.isArray(body)) fromArr(body);
          if (body && typeof body === 'object') {
            fromArr(body.coachLayouts);
            fromArr(body.coachDeckLayouts);
            fromArr(body.layouts);
            fromArr(body.items);

            // Some implementations return a wrapped single layout even on list endpoint.
            fromObj(body.coachLayout);
            fromObj(body.coachDeckLayout);
            fromObj(body.layout);

            // Fallback when endpoint returns a single object directly.
            fromObj(body);
          }

          return ids;
        }

        // ── Status code classification ────────────────────────────────────
        if (statusCode === 200) {
          bruTest(`GET ${endpoint} → 200 OK`, () => {
            expect(statusCode).to.eql(200);
          });
          let body;
          try { body = res.getBody(); } catch (_e) {}
          const bodyNotEmpty = Array.isArray(body)
            ? body.length > 0
            : (body != null && typeof body === 'object' && Object.keys(body).length > 0);
          bruTest(`GET ${endpoint} response body is present and not empty`, () => {
            expect(body, 'Response body should not be null/undefined').to.exist;
            expect(bodyNotEmpty, 'Response array/object should not be empty').to.be.true;
          });

          const coachIds = pickCoachIds(body);
          bruTest(`GET ${endpoint} response contains at least one coach/layout id`, () => {
            expect(coachIds.length, 'No coach/layout id found in list response').to.be.greaterThan(0);
          });

          if (coachIds.length > 0) {
            bru.setEnvVar('coachListHasValidData', 'true');
            bru.setEnvVar('coachListCandidateIds', JSON.stringify(coachIds));
          }
          validationLogger(`[INFO] GET ${endpoint} → 200 OK, ${Array.isArray(body) ? body.length + ' item(s)' : 'body received'}`);

        } else if (statusCode === 401) {
          validationLogger(`[ERROR] GET ${endpoint} → 401 Unauthorized — check access token`);
          bruTest(`GET ${endpoint} → 401 Unauthorized (FAIL)`, () => {
            expect(statusCode, 'Expected 200, got 401 Unauthorized').to.eql(200);
          });

        } else if (statusCode === 403) {
          validationLogger(`[ERROR] GET ${endpoint} → 403 Forbidden — insufficient permissions`);
          bruTest(`GET ${endpoint} → 403 Forbidden (FAIL)`, () => {
            expect(statusCode, 'Expected 200, got 403 Forbidden').to.eql(200);
          });

        } else if (statusCode === 404) {
          validationLogger(`[ERROR] GET ${endpoint} → 404 Not Found — endpoint not implemented by this vendor`);
          bruTest(`GET ${endpoint} → 404 Not Found (FAIL)`, () => {
            expect(statusCode, 'Expected 200, got 404 — endpoint not supported').to.eql(200);
          });

        } else if (statusCode >= 500) {
          validationLogger(`[ERROR] GET ${endpoint} → ${statusCode} Server Error`);
          bruTest(`GET ${endpoint} → ${statusCode} Server Error (FAIL)`, () => {
            expect(statusCode, `Expected 200, got ${statusCode} server error`).to.eql(200);
          });

        } else {
          validationLogger(`[WARNING] GET ${endpoint} → unexpected status ${statusCode}`);
          bruTest(`GET ${endpoint} → unexpected status ${statusCode}`, () => {
            expect(statusCode, `Unexpected status ${statusCode}, expected 200`).to.eql(200);
          });
        }
