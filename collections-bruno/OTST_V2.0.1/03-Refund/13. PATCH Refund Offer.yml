info:
  name: 13. PATCH Refund Offer
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{api_base}}/bookings/{{bookingId}}/refund-offers/{{refundOffersOfferId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  body:
    type: json
    data: |-
      {
        "status": "CONFIRMED"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        const { validationLogger } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postPatchRefundOfferResponse } = require(bru.getEnvVar("library_base")+"refunds.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("PATCH Refund Offer");
          return;
        }

        // Parse JSON safely
        let jsonData;
        let refundOffersArray = [];
        let jsonDataToArray;
        try {
            jsonData = res.getBody();
            if (jsonData.refundOffer) {
                refundOffersArray.push(jsonData.refundOffer);
            }
            jsonDataToArray = {
                refundOffers: refundOffersArray
            };    
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("PATCH Refund Offer (JSON parse)");
            return;
        }
        if (!jsonData.refundOffer) {
            throw new Error("⛔ Exiting script, no refundOffer available in the response");
        }
        postPatchRefundOfferResponse(jsonDataToArray, expectedexchangeOperationStatus = ["CONFIRMED"], expectedFulfillmentStatus=["REFUNDED"]);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
