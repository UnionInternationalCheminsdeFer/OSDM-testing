info:
  name: 16. GET Booking after Delete Refund
  type: http
  seq: 7

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}?embed=ALL"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  params:
    - name: embed
      value: ALL
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        const { validationLogger, displayFulFilledBooking } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base")+"bookings.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
            bru.runner.stopExecution();
            throw new Error(`Exiting script due to wrong response status: ${res.getStatus()}`);
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            bru.runner.stopExecution();
            return;
        }

        if (!jsonData.booking) {
            throw new Error("⛔ Exiting script, no booking available in the response");
        }

        if(bru.getEnvVar("isRefundConfirmed")) {
            // Refund was confirmed (PATCH done) then deleted → parts back to FULFILLED, fulfillment REFUNDED then back
            postCreateBookingResponse(
            bru.getEnvVar("offer"),
            jsonData,
            expectedBookedOffersStatus=["FULFILLED", "CONFIRMED"],
            expectedFulfillmentStatus=["FULFILLED", "CONFIRMED", "REFUNDED"]);
        } else {
            // Refund was never confirmed (DELETE before PATCH) → parts still FULFILLED, fulfillment unchanged
            postCreateBookingResponse(
            bru.getEnvVar("offer"),
            jsonData,
            expectedBookedOffersStatus=["FULFILLED", "CONFIRMED"],
            expectedFulfillmentStatus=["FULFILLED", "CONFIRMED"]);
        }
        displayFulFilledBooking(jsonData);
        bru.runner.stopExecution();

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
