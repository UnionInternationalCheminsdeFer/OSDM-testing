info:
  name: 09. GET Booking after Fulfillments
  type: http
  seq: 8

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        const { validationLogger, displayFulFilledBooking } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base")+"bookings.js");


        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          bru.runner.stopExecution();
          throw new Error(`Exiting script due to wrong response status: ${res.getStatus()}`);
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            bru.runner.stopExecution();
            return;
        }
        postCreateBookingResponse(
        bru.getEnvVar("offer"),
        jsonData,
        ["FULFILLED", "CONFIRMED"],
        ["FULFILLED", "CONFIRMED"]);

        displayFulFilledBooking(jsonData);

        if(bru.getEnvVar("scenarioType")?.includes("REFUND")) {
            bru.runner.setNextRequest("10. POST Refund Offers");
            console.log("scenarioType in data file contains 'REFUND' keyword, executing 10. POST Refund Offers")
        } else if(bru.getEnvVar("scenarioType")?.includes("EXCHANGE")) {
            bru.runner.setNextRequest("10. POST Exchange Offers");
            console.log("scenarioType in data file contains 'EXCHANGE' keyword, executing 10. POST Exchange Offers")    
        } else{
            console.log("scenarioType in data file doesn't contain 'REFUND' or 'EXCHANGE' keyword, ending test scenario ...")    
            bru.runner.stopExecution();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
