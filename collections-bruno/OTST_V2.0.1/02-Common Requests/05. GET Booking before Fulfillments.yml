info:
  name: 05. GET Booking before Fulfillments
  type: http
  seq: 5

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base") + "bookings.js");
        const { displayFulFilledBooking } = require(bru.getEnvVar("library_base") + "displays.js");

        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Booking before Fulfillments");
          return;
        }

        const jsonData = res.getBody();

        postCreateBookingResponse(
            bru.getEnvVar("offer"),
            jsonData,
            ["PREBOOKED"],
            ["ON_HOLD", "AVAILABLE"]
        );

        displayFulFilledBooking(jsonData);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
