info:
  name: 04. GET Passenger
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}/passengers/{{passengerId}}"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        console.log("⏩ [STEP] Executing request : " + req.getName());

        const totalPassengers = bru.getEnvVar("offerPassengerNumber") || 0;
        const currentIndex    = bru.getEnvVar("currentPassengerIndex") || 0;

        if (currentIndex >= totalPassengers) return;

        const passengerIdList            = bru.getEnvVar("passengerIdList");
        const passengerAdditionalData    = JSON.parse(bru.getEnvVar("passengerAdditionalData") || "[]");
        const bookingPassengerSpecs      = JSON.parse(bru.getEnvVar("bookingPassengerSpecifications") || "[]");
        const bookingPassengerReferences = JSON.parse(bru.getEnvVar("bookingPassengerReferences") || "[]");

        const passengerId     = passengerIdList[currentIndex];
        const data            = passengerAdditionalData[currentIndex];
        const passengersRef   = bookingPassengerReferences[currentIndex];
        const passengerGender = bookingPassengerSpecs[currentIndex];

        bru.setEnvVar("passengerId",                      passengerId);
        bru.setEnvVar("passengerSpecificationExternalRef", passengersRef);
        bru.setEnvVar("patchDateOfBirth",  data.updateDateOfBirth  || "");
        bru.setEnvVar("patchFirstName",    data.updateFirstName    || "");
        bru.setEnvVar("patchLastName",     data.updateLastName     || "");
        bru.setEnvVar("patchEmail",        data.updateEmail        || "");
        bru.setEnvVar("patchPhoneNumber",  data.updatePhoneNumber  || "");
        bru.setEnvVar("patchGender",       data.updateGender || passengerGender.gender);
    - type: after-response
      code: |-
        const { patchMultiPassengerResponse } = require(bru.getEnvVar("library_base") + "passengers.js");

        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Passenger");
          return;
        }

        const jsonData = res.getBody();

        if (!jsonData.passenger) {
            throw new Error("⛔ Exiting script, no passenger available in the response");
        }

        const totalPassengers = Number(bru.getEnvVar("offerPassengerNumber"));
        let currentIndex = Number(bru.getEnvVar("currentPassengerIndex"));
        if (isNaN(currentIndex)) currentIndex = 0;

        patchMultiPassengerResponse(jsonData, currentIndex);

        currentIndex++;
        bru.setEnvVar("currentPassengerIndex", currentIndex);

        if (currentIndex < totalPassengers) {
            bru.runner.setNextRequest(req.getName());
        } else {
            bru.runner.setNextRequest("07. GET Booking before Fulfillments");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
