name: OTST_Sqills_Env
variables:
  - secret: true
    name: agent.username
  - secret: true
    name: agent.password
  - secret: true
    name: auth.key_secret
  - secret: true
    name: access_token
  - name: api_base
    value: https://sqills-osdm-test.osdm-s3-adapter.s3p.cloud
  - name: api-host
    value: https://api.sqills-osdm-test.cloud.sqills.com
  - name: library_base
    value: ./library-bruno/
  - name: data_base
    value: http://localhost:8080/data_base/sqills_datafile.json
  - name: json_schema
    value: https://github.com/UnionInternationalCheminsdeFer/OSDM-testing/tree/Bruno-Enhancements/collections-bruno/OTST_V2.0.1/json_validator/datafile.schema.json
  - name: scenariosToRunIndex
    value: "0"
