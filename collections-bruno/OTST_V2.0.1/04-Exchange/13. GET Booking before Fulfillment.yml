info:
  name: 13. GET Booking before Fulfillment
  type: http
  seq: 4

http:
  method: GET
  url: "{{api_base}}/bookings/{{bookingId}}?embed=ALL"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json;version={{osdmVersion}}
    - name: Requestor
      value: "{{requestor}}"
  params:
    - name: embed
      value: ALL
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'console.log("⏩ [STEP] Executing request : " + req.getName());'
    - type: after-response
      code: |-
        const { validationLogger, displayFulFilledBooking } = require(bru.getEnvVar("library_base")+"displays.js");
        const { postCreateBookingResponse } = require(bru.getEnvVar("library_base")+"bookings.js");

        // Validate HTTP response status
        test("Status code is 200", () => {
            expect(res.getStatus(), "[ERROR] Wrong response status").to.eql(200);
        });

        if (res.getStatus() !== 200) {
          test("Status code is 200", () => {
            throw new Error(`[ERROR] Wrong response status: ${res.getStatus()}`);
          });
          const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
          loopbackOrStop("GET Booking before Fulfillment (Exchange)");
          return;
        }

        // Parse JSON safely
        let jsonData;
        try {
            jsonData = res.getBody();
        } catch (e) {
            validationLogger("Failed to parse JSON response");
            test("JSON parsing should succeed", () => {
                throw e;
            });
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("GET Booking before Fulfillment (Exchange, JSON parse)");
            return;
        }
        postCreateBookingResponse(
        bru.getEnvVar("offer"),
        jsonData,
        expectedBookedOffersStatus=["EXCHANGE_ONGOING"],
        expectedFulfillmentStatus=["FULFILLED", "CONFIRMED", "ON_HOLD"]);

        displayFulFilledBooking(jsonData);

        if(bru.getEnvVar("scenarioAction")?.includes("PATCH")) {
            console.log("scenarioAction in data file contains 'PATCH' keyword, not implemented");
            const { loopbackOrStop } = require(bru.getEnvVar("library_base") + "loopback.js");
            loopbackOrStop("Exchange PATCH (not implemented)");
        //     //pm.execution.setNextRequest("13. PATCH Refund Offer");
            //console.log("scenarioAction in data file contains 'PATCH' keyword, executing 13. PATCH Refund Offer")
        } else if(bru.getEnvVar("scenarioAction")?.includes("DELETE")) {
            bru.runner.setNextRequest("16. DEL Exchange Offer");
            console.log("scenarioAction in data file contains 'DELETE' keyword, executing 16. DEL Exchange Offer")    
        } else{
            console.log("scenarioAction in data file doesn't contain 'PATCH' or 'DELETE' keyword, ending test scenario ...")    
            bru.runner.setNextRequest("14. POST Obtaining Fulfillments from Booking");

        //     //pm.execution.setNextRequest(null);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
